<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MonsoonWatch Pakistan</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">

    <main class="auth-container">
        <section class="auth-card">

            <a href="/" class="auth-brand">
                <span class="brand-icon">M</span>
                <span>MonsoonWatch <strong>Pakistan</strong></span>
            </a>

            <div class="auth-heading">
                <span class="auth-label">WELCOME BACK</span>
                <h1>Sign in to your account</h1>
                <p>Access your rainfall analysis and prediction dashboard.</p>
            </div>

            {% if error %}
                <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form action="/login" method="POST" class="auth-form">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Sign In <span>→</span>
                </button>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="/register">Create an account</a>
            </p>

            <div class="auth-footer">
                Pakistan Monsoon Rainfall Forecasting System
            </div>

        </section>
    </main>

</body>
</html>
