<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MonsoonWatch Pakistan</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">

    <main class="auth-container">
        <section class="auth-card">

            <a href="/" class="auth-brand">
                <span class="brand-icon">M</span>
                <span>MonsoonWatch <strong>Pakistan</strong></span>
            </a>

            <div class="auth-heading">
                <span class="auth-label">GET STARTED</span>
                <h1>Create your account</h1>
                <p>Register to explore rainfall analysis and predictions.</p>
            </div>

            {% if error %}
                <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form action="/register" method="POST" class="auth-form">

                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password (minimum 8 characters)"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Create Account <span>→</span>
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="/login">Sign in</a>
            </p>

            <div class="auth-footer">
                Pakistan Monsoon Rainfall Forecasting System
            </div>

        </section>
    </main>

</body>
</html>
